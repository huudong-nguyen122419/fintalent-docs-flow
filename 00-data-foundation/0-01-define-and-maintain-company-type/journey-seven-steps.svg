<svg xmlns="http://www.w3.org/2000/svg" width="700" height="631" viewBox="0 0 700 631" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
<title>Journey health map · the seven steps · 0.01</title>
<rect width="700" height="631" fill="#f7f7f5"/>
<rect x="6" y="6" width="688" height="619" fill="#ffffff" stroke="#e3e1da"/>
<text x="18" y="32" font-size="11" font-weight="700" fill="#5b6069">Step status</text>
<rect x="85.7" y="21.0" width="26.4" height="15" rx="3" fill="#dcfce7"/>
<text x="92.7" y="31.5" font-size="9.5" font-weight="700" fill="#166534">OK</text>
<rect x="120.1" y="21.0" width="63.7" height="15" rx="3" fill="#fef3e2"/>
<text x="127.1" y="31.5" font-size="9.5" font-weight="700" fill="#92400e">DEGRADED</text>
<rect x="191.8" y="21.0" width="75.0" height="15" rx="3" fill="#fee2e2"/>
<text x="198.8" y="31.5" font-size="9.5" font-weight="700" fill="#991b1b">SILENT-FAIL</text>
<text x="276.8" y="32" font-size="11" fill="#8a8e96">— pain chips pinned to the step where they bite, worst first.</text>
<g>
<rect x="18" y="48" width="214" height="181" fill="#ffffff" stroke="#e3e1da"/>
<rect x="18" y="48" width="214" height="4" fill="#92400e"/>
<text x="30" y="74.0" font-size="10" font-weight="700" letter-spacing="0.4" fill="#8a8e96">STEP 1</text>
<text x="30" y="99.0" font-size="13" font-weight="700" fill="#1a1a19">Find companies by type</text>
<text x="30" y="122.0" font-size="11.5" fill="#5b6069">Filtering is fast and exact — but the</text>
<text x="30" y="139.0" font-size="11.5" fill="#5b6069">Corporate bucket itself</text>
<text x="30" y="156.0" font-size="11.5" fill="#5b6069">over-includes: banks and advisories</text>
<text x="30" y="173.0" font-size="11.5" fill="#5b6069">sit in the client list.</text>
<rect x="30.0" y="185.0" width="63.7" height="15" rx="3" fill="#fef3e2"/>
<text x="37.0" y="195.5" font-size="9.5" font-weight="700" fill="#92400e">DEGRADED</text>
<rect x="30.0" y="204.0" width="32.6" height="15" rx="3" fill="#fee2e2"/>
<text x="37.0" y="214.5" font-size="9.5" font-weight="700" fill="#991b1b">P13</text>
<rect x="66.6" y="204.0" width="26.4" height="15" rx="3" fill="#eef0f2"/>
<text x="73.6" y="214.5" font-size="9.5" font-weight="700" fill="#5b6069">P8</text>
</g>
<g>
<rect x="243" y="48" width="214" height="181" fill="#ffffff" stroke="#e3e1da"/>
<rect x="243" y="48" width="214" height="4" fill="#92400e"/>
<text x="255" y="74.0" font-size="10" font-weight="700" letter-spacing="0.4" fill="#8a8e96">STEP 2</text>
<text x="255" y="99.0" font-size="13" font-weight="700" fill="#1a1a19">Check one company</text>
<text x="255" y="122.0" font-size="11.5" fill="#5b6069">Open the panel; read type badges,</text>
<text x="255" y="139.0" font-size="11.5" fill="#5b6069">parent and sponsor links.</text>
<rect x="255.0" y="185.0" width="63.7" height="15" rx="3" fill="#fef3e2"/>
<text x="262.0" y="195.5" font-size="9.5" font-weight="700" fill="#92400e">DEGRADED</text>
<rect x="255.0" y="204.0" width="26.4" height="15" rx="3" fill="#eef0f2"/>
<text x="262.0" y="214.5" font-size="9.5" font-weight="700" fill="#5b6069">P7</text>
</g>
<g>
<rect x="468" y="48" width="214" height="181" fill="#ffffff" stroke="#e3e1da"/>
<rect x="468" y="48" width="214" height="4" fill="#b91c1c"/>
<text x="480" y="74.0" font-size="10" font-weight="700" letter-spacing="0.4" fill="#8a8e96">STEP 3</text>
<text x="480" y="99.0" font-size="13" font-weight="700" fill="#1a1a19">Fix a wrong type</text>
<text x="480" y="122.0" font-size="11.5" fill="#5b6069">While reviewing, the steward spots a</text>
<text x="480" y="139.0" font-size="11.5" fill="#5b6069">mis-tagged firm — there is nowhere</text>
<text x="480" y="156.0" font-size="11.5" fill="#5b6069">to correct it; the bad tag stays.</text>
<rect x="480.0" y="185.0" width="75.0" height="15" rx="3" fill="#fee2e2"/>
<text x="487.0" y="195.5" font-size="9.5" font-weight="700" fill="#991b1b">SILENT-FAIL</text>
<rect x="480.0" y="204.0" width="26.4" height="15" rx="3" fill="#fee2e2"/>
<text x="487.0" y="214.5" font-size="9.5" font-weight="700" fill="#991b1b">P1</text>
</g>
<g>
<rect x="18" y="240" width="214" height="181" fill="#ffffff" stroke="#e3e1da"/>
<rect x="18" y="240" width="214" height="4" fill="#b91c1c"/>
<text x="30" y="266.0" font-size="10" font-weight="700" letter-spacing="0.4" fill="#8a8e96">STEP 4</text>
<text x="30" y="291.0" font-size="13" font-weight="700" fill="#1a1a19">Refresh from the provider</text>
<text x="30" y="314.0" font-size="11.5" fill="#5b6069">Scheduled refreshes rewrite every</text>
<text x="30" y="331.0" font-size="11.5" fill="#5b6069">type value with no warning; the</text>
<text x="30" y="348.0" font-size="11.5" fill="#5b6069">manual refresh button never made it</text>
<text x="30" y="365.0" font-size="11.5" fill="#5b6069">onto the page.</text>
<rect x="30.0" y="377.0" width="75.0" height="15" rx="3" fill="#fee2e2"/>
<text x="37.0" y="387.5" font-size="9.5" font-weight="700" fill="#991b1b">SILENT-FAIL</text>
<rect x="30.0" y="396.0" width="26.4" height="15" rx="3" fill="#ffedd5"/>
<text x="37.0" y="406.5" font-size="9.5" font-weight="700" fill="#9a3412">P3</text>
<rect x="60.4" y="396.0" width="26.4" height="15" rx="3" fill="#fef3e2"/>
<text x="67.4" y="406.5" font-size="9.5" font-weight="700" fill="#92400e">P2</text>
</g>
<g>
<rect x="243" y="240" width="214" height="181" fill="#ffffff" stroke="#e3e1da"/>
<rect x="243" y="240" width="214" height="4" fill="#15803d"/>
<text x="255" y="266.0" font-size="10" font-weight="700" letter-spacing="0.4" fill="#8a8e96">STEP 5</text>
<text x="255" y="291.0" font-size="13" font-weight="700" fill="#1a1a19">A new company arrives</text>
<text x="255" y="314.0" font-size="11.5" fill="#5b6069">A sign-up creates a company with</text>
<text x="255" y="331.0" font-size="11.5" fill="#5b6069">no type — accepted behaviour</text>
<text x="255" y="348.0" font-size="11.5" fill="#5b6069">(2026-08-11); it gains a type on the</text>
<text x="255" y="365.0" font-size="11.5" fill="#5b6069">next provider import.</text>
<rect x="255.0" y="377.0" width="26.4" height="15" rx="3" fill="#dcfce7"/>
<text x="262.0" y="387.5" font-size="9.5" font-weight="700" fill="#166534">OK</text>
<text x="255" y="407.0" font-size="11" fill="#8a8e96">—</text>
</g>
<g>
<rect x="468" y="240" width="214" height="181" fill="#ffffff" stroke="#e3e1da"/>
<rect x="468" y="240" width="214" height="4" fill="#92400e"/>
<text x="480" y="266.0" font-size="10" font-weight="700" letter-spacing="0.4" fill="#8a8e96">STEP 6</text>
<text x="480" y="291.0" font-size="13" font-weight="700" fill="#1a1a19">Bulk tidy-up</text>
<text x="480" y="314.0" font-size="11.5" fill="#5b6069">Admins segment with</text>
<text x="480" y="331.0" font-size="11.5" fill="#5b6069">buckets/labels instead; edits apply</text>
<text x="480" y="348.0" font-size="11.5" fill="#5b6069">but leave no record of who changed</text>
<text x="480" y="365.0" font-size="11.5" fill="#5b6069">what.</text>
<rect x="480.0" y="377.0" width="63.7" height="15" rx="3" fill="#fef3e2"/>
<text x="487.0" y="387.5" font-size="9.5" font-weight="700" fill="#92400e">DEGRADED</text>
<rect x="480.0" y="396.0" width="26.4" height="15" rx="3" fill="#fef3e2"/>
<text x="487.0" y="406.5" font-size="9.5" font-weight="700" fill="#92400e">P6</text>
<rect x="510.4" y="396.0" width="26.4" height="15" rx="3" fill="#fef3e2"/>
<text x="517.4" y="406.5" font-size="9.5" font-weight="700" fill="#92400e">P9</text>
<rect x="540.9" y="396.0" width="32.6" height="15" rx="3" fill="#eef0f2"/>
<text x="547.9" y="406.5" font-size="9.5" font-weight="700" fill="#5b6069">P12</text>
</g>
<g>
<rect x="18" y="432" width="214" height="181" fill="#ffffff" stroke="#e3e1da"/>
<rect x="18" y="432" width="214" height="4" fill="#92400e"/>
<text x="30" y="458.0" font-size="10" font-weight="700" letter-spacing="0.4" fill="#8a8e96">STEP 7</text>
<text x="30" y="483.0" font-size="13" font-weight="700" fill="#1a1a19">Auto-classify &amp; report</text>
<text x="30" y="506.0" font-size="11.5" fill="#5b6069">The automated classifier tags</text>
<text x="30" y="523.0" font-size="11.5" fill="#5b6069">companies, but low-confidence</text>
<text x="30" y="540.0" font-size="11.5" fill="#5b6069">results hide in logs and four &quot;type&quot;</text>
<text x="30" y="557.0" font-size="11.5" fill="#5b6069">vocabularies disagree in reports.</text>
<rect x="30.0" y="569.0" width="63.7" height="15" rx="3" fill="#fef3e2"/>
<text x="37.0" y="579.5" font-size="9.5" font-weight="700" fill="#92400e">DEGRADED</text>
<rect x="30.0" y="588.0" width="26.4" height="15" rx="3" fill="#ffedd5"/>
<text x="37.0" y="598.5" font-size="9.5" font-weight="700" fill="#9a3412">P5</text>
<rect x="60.4" y="588.0" width="32.6" height="15" rx="3" fill="#fef3e2"/>
<text x="67.4" y="598.5" font-size="9.5" font-weight="700" fill="#92400e">P11</text>
</g>
</svg>
