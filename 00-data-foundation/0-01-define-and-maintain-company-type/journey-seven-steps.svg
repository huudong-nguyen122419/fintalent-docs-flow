<rect x="85.7" y="21.0" width="26.4" height="15" rx="3" fill="#dcfce7"/>
<text x="92.7" y="31.5" font-size="9.5" font-weight="700" fill="#166534">OK</text>
<rect x="120.1" y="21.0" width="63.7" height="15" rx="3" fill="#fef3e2"/>
<text x="127.1" y="31.5" font-size="9.5" font-weight="700" fill="#92400e">DEGRADED</text>
<rect x="191.8" y="21.0" width="75.0" height="15" rx="3" fill="#fee2e2"/>
<text x="198.8" y="31.5" font-size="9.5" font-weight="700" fill="#991b1b">SILENT-FAIL</text>
<text x="276.8" y="32" font-size="11" fill="#8a8e96">— pain chips pinned to the step where they bite, worst first.</text>
<g>
<rect x="18" y="48" width="180" height="215" fill="#ffffff" stroke="#e3e1da"/>
<rect x="18" y="48" width="180" height="4" fill="#92400e"/>
<text x="30" y="74.0" font-size="10" font-weight="700" letter-spacing="0.4" fill="#8a8e96">STEP 1</text>
<text x="30" y="99.0" font-size="13" font-weight="700" fill="#1a1a19">Find companies by type</text>
<text x="30" y="122.0" font-size="11.5" fill="#5b6069">Filtering is fast and exact —</text>
<text x="30" y="139.0" font-size="11.5" fill="#5b6069">but the Corporate bucket itself</text>
<text x="30" y="156.0" font-size="11.5" fill="#5b6069">over-includes: banks and</text>
<text x="30" y="173.0" font-size="11.5" fill="#5b6069">advisories sit in the client</text>
<text x="30" y="190.0" font-size="11.5" fill="#5b6069">list.</text>
<rect x="30.0" y="219.0" width="63.7" height="15" rx="3" fill="#fef3e2"/>
<text x="37.0" y="229.5" font-size="9.5" font-weight="700" fill="#92400e">DEGRADED</text>
<rect x="30.0" y="238.0" width="32.6" height="15" rx="3" fill="#fee2e2"/>
<text x="37.0" y="248.5" font-size="9.5" font-weight="700" fill="#991b1b">P13</text>
<rect x="66.6" y="238.0" width="26.4" height="15" rx="3" fill="#eef0f2"/>
<text x="73.6" y="248.5" font-size="9.5" font-weight="700" fill="#5b6069">P8</text>
</g>
<g>
<rect x="209" y="48" width="180" height="215" fill="#ffffff" stroke="#e3e1da"/>
<rect x="209" y="48" width="180" height="4" fill="#92400e"/>
<text x="221" y="74.0" font-size="10" font-weight="700" letter-spacing="0.4" fill="#8a8e96">STEP 2</text>
<text x="221" y="99.0" font-size="13" font-weight="700" fill="#1a1a19">Check one company</text>
<text x="221" y="122.0" font-size="11.5" fill="#5b6069">Open the panel; read type</text>
<text x="221" y="139.0" font-size="11.5" fill="#5b6069">badges, parent and sponsor</text>
<text x="221" y="156.0" font-size="11.5" fill="#5b6069">links.</text>
<rect x="221.0" y="219.0" width="63.7" height="15" rx="3" fill="#fef3e2"/>
<text x="228.0" y="229.5" font-size="9.5" font-weight="700" fill="#92400e">DEGRADED</text>
<rect x="221.0" y="238.0" width="26.4" height="15" rx="3" fill="#eef0f2"/>
<text x="228.0" y="248.5" font-size="9.5" font-weight="700" fill="#5b6069">P7</text>
</g>
<g>
<rect x="400" y="48" width="180" height="215" fill="#ffffff" stroke="#e3e1da"/>
<rect x="400" y="48" width="180" height="4" fill="#b91c1c"/>
<text x="412" y="74.0" font-size="10" font-weight="700" letter-spacing="0.4" fill="#8a8e96">STEP 3</text>
<text x="412" y="99.0" font-size="13" font-weight="700" fill="#1a1a19">Fix a wrong type</text>
<text x="412" y="122.0" font-size="11.5" fill="#5b6069">While reviewing, the steward</text>
<text x="412" y="139.0" font-size="11.5" fill="#5b6069">spots a mis-tagged firm —</text>
<text x="412" y="156.0" font-size="11.5" fill="#5b6069">there is nowhere to correct it;</text>
<text x="412" y="173.0" font-size="11.5" fill="#5b6069">the bad tag stays.</text>
<rect x="412.0" y="219.0" width="75.0" height="15" rx="3" fill="#fee2e2"/>
<text x="419.0" y="229.5" font-size="9.5" font-weight="700" fill="#991b1b">SILENT-FAIL</text>
<rect x="412.0" y="238.0" width="26.4" height="15" rx="3" fill="#fee2e2"/>
<text x="419.0" y="248.5" font-size="9.5" font-weight="700" fill="#991b1b">P1</text>
</g>
<g>
<rect x="591" y="48" width="180" height="215" fill="#ffffff" stroke="#e3e1da"/>
<rect x="591" y="48" width="180" height="4" fill="#b91c1c"/>
<text x="603" y="74.0" font-size="10" font-weight="700" letter-spacing="0.4" fill="#8a8e96">STEP 4</text>
<text x="603" y="99.0" font-size="13" font-weight="700" fill="#1a1a19">Refresh from the provider</text>
<text x="603" y="122.0" font-size="11.5" fill="#5b6069">Scheduled refreshes rewrite</text>
<text x="603" y="139.0" font-size="11.5" fill="#5b6069">every type value with no</text>
<text x="603" y="156.0" font-size="11.5" fill="#5b6069">warning; the manual refresh</text>
<text x="603" y="173.0" font-size="11.5" fill="#5b6069">button never made it onto the</text>
<text x="603" y="190.0" font-size="11.5" fill="#5b6069">page.</text>
<rect x="603.0" y="219.0" width="75.0" height="15" rx="3" fill="#fee2e2"/>
<text x="610.0" y="229.5" font-size="9.5" font-weight="700" fill="#991b1b">SILENT-FAIL</text>
<rect x="603.0" y="238.0" width="26.4" height="15" rx="3" fill="#ffedd5"/>
<text x="610.0" y="248.5" font-size="9.5" font-weight="700" fill="#9a3412">P3</text>
<rect x="633.4" y="238.0" width="26.4" height="15" rx="3" fill="#fef3e2"/>
<text x="640.4" y="248.5" font-size="9.5" font-weight="700" fill="#92400e">P2</text>
</g>
<g>
<rect x="782" y="48" width="180" height="215" fill="#ffffff" stroke="#e3e1da"/>
<rect x="782" y="48" width="180" height="4" fill="#15803d"/>
<text x="794" y="74.0" font-size="10" font-weight="700" letter-spacing="0.4" fill="#8a8e96">STEP 5</text>
<text x="794" y="99.0" font-size="13" font-weight="700" fill="#1a1a19">A new company arrives</text>
<text x="794" y="122.0" font-size="11.5" fill="#5b6069">A sign-up creates a company</text>
<text x="794" y="139.0" font-size="11.5" fill="#5b6069">with no type — accepted</text>
<text x="794" y="156.0" font-size="11.5" fill="#5b6069">behaviour (2026-08-11); it</text>
<text x="794" y="173.0" font-size="11.5" fill="#5b6069">gains a type on the next</text>
<text x="794" y="190.0" font-size="11.5" fill="#5b6069">provider import.</text>
<rect x="794.0" y="219.0" width="26.4" height="15" rx="3" fill="#dcfce7"/>
<text x="801.0" y="229.5" font-size="9.5" font-weight="700" fill="#166534">OK</text>
<text x="794" y="249.0" font-size="11" fill="#8a8e96">—</text>
</g>
<g>
<rect x="973" y="48" width="180" height="215" fill="#ffffff" stroke="#e3e1da"/>
<rect x="973" y="48" width="180" height="4" fill="#92400e"/>
<text x="985" y="74.0" font-size="10" font-weight="700" letter-spacing="0.4" fill="#8a8e96">STEP 6</text>
<text x="985" y="99.0" font-size="13" font-weight="700" fill="#1a1a19">Bulk tidy-up</text>
<text x="985" y="122.0" font-size="11.5" fill="#5b6069">Admins segment with</text>
<text x="985" y="139.0" font-size="11.5" fill="#5b6069">buckets/labels instead; edits</text>
<text x="985" y="156.0" font-size="11.5" fill="#5b6069">apply but leave no record of</text>
<text x="985" y="173.0" font-size="11.5" fill="#5b6069">who changed what.</text>
<rect x="985.0" y="219.0" width="63.7" height="15" rx="3" fill="#fef3e2"/>
<text x="992.0" y="229.5" font-size="9.5" font-weight="700" fill="#92400e">DEGRADED</text>
<rect x="985.0" y="238.0" width="26.4" height="15" rx="3" fill="#fef3e2"/>
<text x="992.0" y="248.5" font-size="9.5" font-weight="700" fill="#92400e">P6</text>
<rect x="1015.4" y="238.0" width="26.4" height="15" rx="3" fill="#fef3e2"/>
<text x="1022.4" y="248.5" font-size="9.5" font-weight="700" fill="#92400e">P9</text>
<rect x="1045.9" y="238.0" width="32.6" height="15" rx="3" fill="#eef0f2"/>
<text x="1052.9" y="248.5" font-size="9.5" font-weight="700" fill="#5b6069">P12</text>
</g>
<g>
<rect x="1164" y="48" width="180" height="215" fill="#ffffff" stroke="#e3e1da"/>
<rect x="1164" y="48" width="180" height="4" fill="#92400e"/>
<text x="1176" y="74.0" font-size="10" font-weight="700" letter-spacing="0.4" fill="#8a8e96">STEP 7</text>
<text x="1176" y="99.0" font-size="13" font-weight="700" fill="#1a1a19">Auto-classify &amp; report</text>
<text x="1176" y="122.0" font-size="11.5" fill="#5b6069">The automated classifier tags</text>
<text x="1176" y="139.0" font-size="11.5" fill="#5b6069">companies, but</text>
<text x="1176" y="156.0" font-size="11.5" fill="#5b6069">low-confidence results hide</text>
<text x="1176" y="173.0" font-size="11.5" fill="#5b6069">in logs and four &quot;type&quot;</text>
<text x="1176" y="190.0" font-size="11.5" fill="#5b6069">vocabularies disagree in</text>
<text x="1176" y="207.0" font-size="11.5" fill="#5b6069">reports.</text>
<rect x="1176.0" y="219.0" width="63.7" height="15" rx="3" fill="#fef3e2"/>
<text x="1183.0" y="229.5" font-size="9.5" font-weight="700" fill="#92400e">DEGRADED</text>
<rect x="1176.0" y="238.0" width="26.4" height="15" rx="3" fill="#ffedd5"/>
<text x="1183.0" y="248.5" font-size="9.5" font-weight="700" fill="#9a3412">P5</text>
<rect x="1206.4" y="238.0" width="32.6" height="15" rx="3" fill="#fef3e2"/>
<text x="1213.4" y="248.5" font-size="9.5" font-weight="700" fill="#92400e">P11</text>
</g>
<text x="18" y="279" font-size="11" fill="#8a8e96">Steps 1→7 left to right as the journey runs. Chips reference the pain key in §1; P13 is created by step 4's re-derivation but felt at step 1; P10 (one-sided validation of the lifecycle field) sits beside the flow on step 2's edit panel.</text>
