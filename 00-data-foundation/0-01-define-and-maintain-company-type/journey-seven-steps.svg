<svg xmlns="http://www.w3.org/2000/svg" width="1362" height="312" viewBox="0 0 1362 312" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
<title>Journey health map · the seven steps · 0.01</title>
